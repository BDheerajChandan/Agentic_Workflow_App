# DJ Services itself: backend (API + Docker control) and dashboard.
# Managed applications are created dynamically by the backend (labelled dj.managed=true).
#
# COMPOSE_PROFILES (set in .env):
#   socket  backend mounts the Docker socket directly            (default, simplest, highly privileged)
#   proxy   backend talks to a filtered Docker API proxy         (recommended hardening, see README)

name: dj_services

x-backend: &backend
  build:
    context: ./backend
  image: dj_services_backend:latest
  container_name: dj_services_backend
  restart: unless-stopped
  ports:
    - "127.0.0.1:${API_PORT:-8010}:8010"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - dj_services_net
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  RUNNING_IN_DOCKER: "true"
  APP_ENV: ${APP_ENV:-production}
  API_HOST: 0.0.0.0
  API_PORT: "8010"
  RELOAD: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_DIR: /var/log/dj_services
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175}
  ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env. This backend controls Docker, so the API must be protected.}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-postgres}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_SCHEMA: ${DB_SCHEMA:-dj_services}
  SERVICES_BASE_DIR: /projects/${DJ_SERVICES_DIR:-App_services}
  PROJECTS_ROOT: /projects
  HOST_PROJECTS_ROOT: ${HOST_PROJECTS_ROOT:?Set HOST_PROJECTS_ROOT in .env (Windows path with forward slashes).}
  DOCKER_NETWORK: dj_services_net
  MONITOR_INTERVAL: ${MONITOR_INTERVAL:-5}
  RECONCILE_ON_START: ${RECONCILE_ON_START:-true}
  ALLOW_CUSTOM_COMMANDS: "false"
  ALLOW_REMOTE_BIND: "false"
  DOCKER_TIMEOUT: ${DOCKER_TIMEOUT:-120}   # keep this one

services:
  backend:
    <<: *backend
    profiles: ["socket"]
    environment:
      <<: *backend-env
    volumes:
      - type: bind
        source: ${HOST_PROJECTS_ROOT:?Set HOST_PROJECTS_ROOT in .env}
        target: /projects
        read_only: true
      - type: bind
        source: ./backend/app/config
        target: /srv/backend/app/config
      - type: volume
        source: dj_services_logs
        target: /var/log/dj_services
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock

  backend-proxy:
    <<: *backend
    profiles: ["proxy"]
    depends_on:
      - docker-proxy
    environment:
      <<: *backend-env
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - type: bind
        source: ${HOST_PROJECTS_ROOT:?Set HOST_PROJECTS_ROOT in .env}
        target: /projects
        read_only: true
      - type: bind
        source: ./backend/app/config
        target: /srv/backend/app/config
      - type: volume
        source: dj_services_logs
        target: /var/log/dj_services

  docker-proxy:
    # Filters the Docker API to the sections DJ Services needs. UNTESTED here: check the variables
    # against the proxy's README, and pin a version instead of :latest.
    image: tecnativa/docker-socket-proxy:latest
    profiles: ["proxy"]
    container_name: dj_services_docker_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      BUILD: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      AUTH: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dj_services_net

  dashboard:
    build:
      context: ./frontend/app_service
      target: ${DASHBOARD_TARGET:-prod}
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8010}
    image: dj_services_dashboard:latest
    container_name: dj_services_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5175}:8080"
    networks:
      - dj_services_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  dj_services_net:
    name: dj_services_net

volumes:
  dj_services_logs:
    name: dj_services_logs